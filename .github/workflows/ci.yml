name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Syntax
        run: node --check index.js

      - name: Lint
        run: npm run lint

      # Protocol handshake + tool-schema validation. Offline: no network, no
      # credentials, so it is safe on a public runner.
      - name: Smoke test
        run: npm run smoke

      - name: Hygiene (secrets, personal data, tracked state files)
        run: npm run hygiene

      # The suites drive the server over stdio against a local mock of
      # api.pingen.com. They never reach the real API and cannot post a letter.
      # Fails the build below 90% lines / 90% functions / 80% branches.
      - name: Tests + coverage
        run: npm run coverage

      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true
